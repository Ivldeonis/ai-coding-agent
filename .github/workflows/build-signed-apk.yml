name: 🔐 Build Signed APK (Release)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes'
        required: false
        type: string

env:
  NODE_VERSION: '18'
  JAVA_VERSION: '17'

jobs:
  build-signed:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📋 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📚 Install dependencies
        run: |
          npm ci
          npm install expo-file-system expo-document-picker expo-permissions

      - name: 🔑 Setup signing key
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > keystore.jks
          ls -lh keystore.jks

      - name: 🔨 Build signed release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            -Dorg.gradle.jvmargs="-Xmx2048m" \
            -Pandroid.injected.signing.store.file=$PWD/../keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEYSTORE_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_KEY_PASSWORD }}"

      - name: 📦 Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          body: |
            ## Signed Release Build #${{ github.run_number }}
            
            ### Release Notes
            ${{ github.event.inputs.release_notes || 'No release notes provided' }}
            
            ### Build Information
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Date**: ${{ github.event.repository.updated_at }}
            
            ### Installation
            ```bash
            adb install -r app-release.apk
            ```
            
            ### Version
            - **Package**: com.deonisis.devagent
            - **Build Number**: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: success()

      - name: 📧 Notify success
        if: success()
        run: |
          echo "✅ Signed APK built successfully!"
          echo "📦 Build #${{ github.run_number }}"

      - name: ❌ Notify failure
        if: failure()
        run: |
          echo "❌ Build failed!"
          exit 1
